{% extends "base.html" %}
{% block content %}
<div class="fixed inset-0 bg-cover bg-center bg-no-repeat"
     style="background-image: url('{{ url_for('static', filename='images/hello.jpg') }}'); z-index: -1;">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-[2px]"></div>
</div>

<div class="min-h-screen flex flex-col justify-center items-center text-white px-6 relative">
    <h1 class="text-5xl md:text-6xl font-heading font-semibold drop-shadow-lg text-center mb-12">
        Welcome to <span class="text-[#C4A484]">Library Management System</span>
    </h1>
    <div class="flex flex-col sm:flex-row gap-6">
        <a href="{{ url_for('auth') }}?tab=admin" class="bg-[#C4A484] hover:bg-[#A1885E] text-white font-bold py-4 px-10 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 text-center text-lg min-w-[200px]">Admin Login</a>
        <a href="{{ url_for('auth') }}?tab=student" class="bg-[#C4A484] hover:bg-[#A1885E] text-white font-bold py-4 px-10 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 text-center text-lg min-w-[200px]">Student Login</a>
        <a href="{{ url_for('auth') }}?tab=register" class="bg-[#C4A484] hover:bg-[#A1885E] text-white font-bold py-4 px-10 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 text-center text-lg min-w-[200px]">Student Register</a>
    </div>
    <footer class="absolute bottom-6 text-sm text-white/80">
        Powered by <span class="font-semibold">Code_of_Duty</span>
    </footer>
</div>
{% endblock %}
