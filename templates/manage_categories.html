{% extends "base.html" %}
{% block content %}
<div class="fixed inset-0 bg-cover bg-center bg-no-repeat"
     style="background-image: url('{{ url_for('static', filename='images/background.jpg') }}'); z-index: -1;">
</div>

<div class="min-h-screen flex items-center justify-center p-4">
 <div class="w-full max-w-5xl bg-white bg-opacity-50 backdrop-blur-sm rounded-xl shadow-xl overflow-hidden">
     <div class="bg-[#C4A484] px-6 py-5">
        <h2 class="text-3xl font-semibold text-white text-center tracking-tight">Manage Categories</h2>
     </div>

     <!-- Add new category -->
     <form method="POST" class="p-6 grid grid-cols-1 md:grid-cols-3 gap-3 items-end border-b border-gray-300 bg-white bg-opacity-60">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="add">
        <div>
            <label class="block text-lg font-semibold text-center">Name</label>
            <input type="text" name="name" required maxlength="50" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
            <label class="block text-lg font-semibold text-center">Description</label>
            <input type="text" name="description" maxlength="255" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">Add Category</button>
     </form>

     <!-- Categories table -->
     <div class="overflow-x-auto p-4">
     <table class="w-full border-collapse border border-gray-300 bg-white">
        <thead>
            <tr class="bg-gray-200">
                <th class="border border-gray-300 px-3 py-2">ID</th>
                <th class="border border-gray-300 px-3 py-2">Name</th>
                <th class="border border-gray-300 px-3 py-2">Description</th>
                <th class="border border-gray-300 px-3 py-2">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for c in categories %}
            <tr id="row-{{ c['id'] }}">
                <td class="border border-gray-300 px-3 py-2 text-center">{{ c['id'] }}</td>

                <!-- Editable Name cell -->
                <td class="border border-gray-300 px-3 py-2">
                    <input type="text" id="name-{{ c['id'] }}" value="{{ c['name'] | e }}"
                           class="w-full px-2 py-1 border border-gray-300 rounded">
                </td>

                <!-- Editable Description cell -->
                <td class="border border-gray-300 px-3 py-2">
                    <input type="text" id="desc-{{ c['id'] }}" value="{{ c['description'] | e if c['description'] else '' }}"
                           class="w-full px-2 py-1 border border-gray-300 rounded">
                </td>

                <!-- Actions cell with Save & Delete buttons -->
                <td class="border border-gray-300 px-3 py-2 whitespace-nowrap text-center">
                    <!-- Save form (hidden fields get values from JavaScript) -->
                    <form method="POST" class="inline-block" id="save-form-{{ c['id'] }}" onsubmit="prepareSave({{ c['id'] }})">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="action" value="edit">
                        <input type="hidden" name="id" value="{{ c['id'] }}">
                        <input type="hidden" name="name" id="save-name-{{ c['id'] }}">
                        <input type="hidden" name="description" id="save-desc-{{ c['id'] }}">
                        <button type="submit" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600 transition">Save</button>
                    </form>

                    <!-- Delete form -->
                    <form method="POST" class="inline-block ml-2" onsubmit="return confirm('Delete this category? Books linked to it will be unlinked.');">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="action" value="delete">
                        <input type="hidden" name="id" value="{{ c['id'] }}">
                        <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 transition">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
     </table>
     </div>

     <a href="{{ url_for('admin_dashboard') }}" class="block bg-gray-500 text-white px-4 py-2 rounded mt-4 mx-4 mb-4 text-center hover:bg-gray-600 transition">Back to Dashboard</a>
     <footer class="text-center text-sm mb-6">
        <p class="drop-shadow-md">Powered by <span class="font-semibold">Code_of_Duty</span></p>
     </footer>
 </div>
</div>
<div class="mb-10"></div>

<script>
    function prepareSave(catId) {
        let nameInput = document.getElementById('name-' + catId);
        let descInput = document.getElementById('desc-' + catId);
        document.getElementById('save-name-' + catId).value = nameInput.value;
        document.getElementById('save-desc-' + catId).value = descInput.value;
        return true;
    }
</script>
{% endblock %}
