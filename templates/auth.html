{% extends "base.html" %}
{% block content %}
<div class="fixed inset-0 bg-cover bg-center bg-no-repeat"
     style="background-image: url('{{ url_for('static', filename='images/background2.jpg') }}'); z-index: -1;">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-[3px]"></div>
</div>
<div class="min-h-screen flex items-center justify-center p-8 relative">
    <div class="w-full max-w-xl glass-card rounded-2xl shadow-2xl overflow-hidden">
        <div class="flex border-b border-gray-200/50 bg-white/30 backdrop-blur-sm">
            <button class="tab-btn flex-1 py-4 text-center font-semibold transition-all duration-200" data-tab="admin" onclick="switchTab('admin')">Admin Login</button>
            <button class="tab-btn flex-1 py-4 text-center font-semibold transition-all duration-200" data-tab="student" onclick="switchTab('student')">Student Login</button>
            <button class="tab-btn flex-1 py-4 text-center font-semibold transition-all duration-200" data-tab="register" onclick="switchTab('register')">Student Register</button>
        </div>
        <div id="tab-admin" class="tab-pane p-6 space-y-4">
            <form method="POST" action="{{ url_for('admin_login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xl font-semibold text-gray-800">Username</label>
                        <input type="text" name="username" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-[#C4A484] focus:ring-2 focus:ring-[#C4A484]/20 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xl font-semibold text-gray-800">Password</label>
                        <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-[#C4A484] focus:ring-2 focus:ring-[#C4A484]/20 outline-none transition">
                    </div>
                    <button type="submit" class="w-full bg-[#C4A484] hover:bg-[#B08B6E] text-white font-semibold py-2.5 rounded-lg transition shadow-md hover:shadow-lg">
                        Login as Admin
                    </button>
                </div>
            </form>
        </div>
        <div id="tab-student" class="tab-pane hidden p-8 space-y-6">
            <form method="POST" action="{{ url_for('student_login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xl font-semibold text-gray-800">Username</label>
                        <input type="text" name="username" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-[#C4A484] focus:ring-2 focus:ring-[#C4A484]/20 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xl font-semibold text-gray-800">Password</label>
                        <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-[#C4A484] focus:ring-2 focus:ring-[#C4A484]/20 outline-none transition">
                    </div>
                    <button type="submit" class="w-full bg-[#C4A484] hover:bg-[#B08B6E] text-white font-semibold py-2.5 rounded-lg transition shadow-md hover:shadow-lg">
                        Login as Student
                    </button>
                </div>
            </form>
            <div class="text-center text-xl text-gray-600">Don't have an account? <span class="text-[#C4A484] font-medium cursor-pointer" onclick="switchTab('register')">Register here</span></div>
        </div>
        <div id="tab-register" class="tab-pane hidden p-8 space-y-6">
            <form method="POST" action="{{ url_for('student_register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xl font-semibold text-gray-800">Username</label>
                        <input type="text" name="username" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-[#C4A484] focus:ring-2 focus:ring-[#C4A484]/20 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xl font-semibold text-gray-800">Password</label>
                        <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-[#C4A484] focus:ring-2 focus:ring-[#C4A484]/20 outline-none transition">
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md hover:shadow-lg">
                        Register
                    </button>
                </div>
            </form>
            <div class="text-center text-xl text-gray-600">Already have an account? <span class="text-[#C4A484] font-medium cursor-pointer" onclick="switchTab('student')">Login here</span></div>
        </div>
        <footer class="text-center text-xs text-gray-500 py-4 border-t border-gray-200/50">
            Powered by <span class="font-semibold">Code_of_Duty</span>
        </footer>
    </div>
</div>

<script>
    function switchTab(tabId) {
        // Hide all tab panes
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.add('hidden'));
        // Show selected pane
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        // Update button styles
        document.querySelectorAll('.tab-btn').forEach(btn => {
            const isActive = btn.dataset.tab === tabId;
            if (isActive) {
                btn.classList.add('bg-white/60', 'text-[#C4A484]', 'border-b-2', 'border-[#C4A484]');
                btn.classList.remove('text-gray-700');
            } else {
                btn.classList.remove('bg-white/60', 'text-[#C4A484]', 'border-b-2', 'border-[#C4A484]');
                btn.classList.add('text-gray-700');
            }
        });
    }
    // Activate tab based on URL parameter ?tab=
    const urlParams = new URLSearchParams(window.location.search);
    const activeTab = urlParams.get('tab');
    if (activeTab && ['admin', 'student', 'register'].includes(activeTab)) {
        switchTab(activeTab);
    } else {
        switchTab('admin');
    }
</script>
{% endblock %}
