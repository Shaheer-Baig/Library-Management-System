{% extends "base.html" %}
{% block content %}
<div class="fixed inset-0 bg-cover bg-center bg-no-repeat"
     style="background-image: url('{{ url_for('static', filename='images/background.jpg') }}'); z-index: -1;">
</div>
<div class="min-h-screen flex items-center justify-center p-4">
 <div class="w-full max-w-7xl bg-white bg-opacity-50 backdrop-blur-sm rounded-xl shadow-xl overflow-hidden">
     <div class="bg-[#C4A484] px-6 py-5">
        <h2 class="text-3xl font-semibold text-white text-center tracking-tight">Manage Books</h2>
     </div>
     <form method="POST" class="p-6 grid grid-cols-1 md:grid-cols-6 gap-3 items-end border-b border-gray-300 bg-white bg-opacity-60">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="add">
        <div>
            <label class="block text-lg font-semibold text-center">Title</label>
            <input type="text" name="title" required maxlength="150" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
            <label class="block text-lg font-semibold text-center">Author</label>
            <input type="text" name="author" required maxlength="100" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
            <label class="block text-lg font-semibold text-center">ISBN</label>
            <input type="text" name="isbn" required maxlength="20" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        </div>
        <div>
            <label class="block text-lg font-semibold text-center">Category</label>
            <select name="category_id" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                <option value="">- None -</option>
                {% for c in categories %}
                <option value="{{ c['id'] }}">{{ c['name'] | e }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-lg font-semibold text-center">Publisher</label>
            <select name="publisher_id" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                <option value="">- None -</option>
                {% for p in publishers %}
                <option value="{{ p['id'] }}">{{ p['name'] | e }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">Add Book</button>
     </form>
     <div class="flex justify-center px-4">
        <form method="GET" class="w-full max-w-5xl bg-white bg-opacity-60 rounded-lg p-4 my-2">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                <div>
                    <input type="text" name="q" value="{{ q | e }}" placeholder="Search by title or author..." class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <select name="cat_id" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                        <option value="">All categories</option>
                        {% for c in categories %}
                        <option value="{{ c['id'] }}" {% if selected_cat == c['id'] %}selected{% endif %}>{{ c['name'] | e }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">Filter</button>
                    <a href="{{ url_for('manage_books') }}" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition">Reset</a>
                </div>
                <div>
                    <a href="{{ url_for('admin_dashboard') }}" class="block bg-gray-500 text-white px-4 py-2 rounded text-center hover:bg-gray-600 transition">Back to Dashboard</a>
                </div>
            </div>
        </form>
     </div>
     <div class="overflow-x-auto p-4">
     <table class="w-full border-collapse border border-gray-300 bg-white">
        <thead>
            <tr class="bg-gray-200">
                <th class="border border-gray-300 px-2 py-2">ID</th>
                <th class="border border-gray-300 px-2 py-2">Title</th>
                <th class="border border-gray-300 px-2 py-2">Author</th>
                <th class="border border-gray-300 px-2 py-2">ISBN</th>
                <th class="border border-gray-300 px-2 py-2">Category</th>
                <th class="border border-gray-300 px-2 py-2">Publisher</th>
                <th class="border border-gray-300 px-2 py-2">Status</th>
                <th class="border border-gray-300 px-2 py-2">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for b in books %}
            <tr id="row-{{ b['id'] }}">
                <td class="border border-gray-300 px-2 py-2 text-center">{{ b['id'] }}</td>
                <td class="border border-gray-300 px-2 py-2">
                    <input type="text" id="title-{{ b['id'] }}" value="{{ b['title'] | e }}" class="w-full px-2 py-1 border border-gray-300 rounded" maxlength="150">
                </td>
                <td class="border border-gray-300 px-2 py-2">
                    <input type="text" id="author-{{ b['id'] }}" value="{{ b['author'] | e }}" class="w-full px-2 py-1 border border-gray-300 rounded" maxlength="100">
                </td>
                <td class="border border-gray-300 px-2 py-2">
                    <input type="text" id="isbn-{{ b['id'] }}" value="{{ b['isbn'] | e }}" class="w-full px-2 py-1 border border-gray-300 rounded" maxlength="20">
                </td>
                <td class="border border-gray-300 px-2 py-2">
                    <select id="cat-{{ b['id'] }}" class="w-full px-2 py-1 border border-gray-300 rounded">
                        <option value="">- None -</option>
                        {% for c in categories %}
                        <option value="{{ c['id'] }}" {% if b['category_id'] == c['id'] %}selected{% endif %}>{{ c['name'] | e }}</option>
                        {% endfor %}
                    </select>
                </td>
                <td class="border border-gray-300 px-2 py-2">
                    <select id="pub-{{ b['id'] }}" class="w-full px-2 py-1 border border-gray-300 rounded">
                        <option value="">- None -</option>
                        {% for p in publishers %}
                        <option value="{{ p['id'] }}" {% if b['publisher_id'] == p['id'] %}selected{% endif %}>{{ p['name'] | e }}</option>
                        {% endfor %}
                    </select>
                </td>
                <td class="border border-gray-300 px-2 py-2 text-center">
                    <span class="px-2 py-1 rounded text-xs font-semibold
                        {% if b['status'] == 'Available' %}bg-green-100 text-green-800
                        {% elif b['status'] == 'Issued' %}bg-blue-100 text-blue-800
                        {% else %}bg-yellow-100 text-yellow-800{% endif %}">
                        {{ b['status'] }}
                    </span>
                </td>
                <td class="border border-gray-300 px-2 py-2 whitespace-nowrap text-center">
                    <form method="POST" class="inline-block" id="save-form-{{ b['id'] }}" onsubmit="prepareBookSave({{ b['id'] }})">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="action" value="edit">
                        <input type="hidden" name="id" value="{{ b['id'] }}">
                        <input type="hidden" name="title" id="save-title-{{ b['id'] }}">
                        <input type="hidden" name="author" id="save-author-{{ b['id'] }}">
                        <input type="hidden" name="isbn" id="save-isbn-{{ b['id'] }}">
                        <input type="hidden" name="category_id" id="save-cat-{{ b['id'] }}">
                        <input type="hidden" name="publisher_id" id="save-pub-{{ b['id'] }}">
                        <button type="submit" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600 transition">Save</button>
                    </form>
                    <form method="POST" class="inline-block ml-2" onsubmit="return confirm('Delete this book? This will also delete loans, fines, reservations.');">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="action" value="delete">
                        <input type="hidden" name="id" value="{{ b['id'] }}">
                        <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 transition">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
     </table>
     </div>
     <footer class="text-center text-sm mb-6">
        <p class="drop-shadow-md">Powered by <span class="font-semibold">Code_of_Duty</span></p>
     </footer>
 </div>
</div>
<div class="mb-10"></div>

<script>
    function prepareBookSave(bookId) {
        document.getElementById('save-title-' + bookId).value = document.getElementById('title-' + bookId).value;
        document.getElementById('save-author-' + bookId).value = document.getElementById('author-' + bookId).value;
        document.getElementById('save-isbn-' + bookId).value = document.getElementById('isbn-' + bookId).value;
        document.getElementById('save-cat-' + bookId).value = document.getElementById('cat-' + bookId).value;
        document.getElementById('save-pub-' + bookId).value = document.getElementById('pub-' + bookId).value;
        return true;
    }
</script>
{% endblock %}
