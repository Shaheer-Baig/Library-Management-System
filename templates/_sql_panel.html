{% if queries %}
<div id="sql-panel"
     style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
            background: #1e293b; color: #e2e8f0; border-top: 2px solid #38bdf8;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">

    <div style="display: flex; justify-content: space-between; align-items: center;
                padding: 6px 12px; background: #0f172a;">
        <strong style="color: #38bdf8;">
            SQL Executed (this request) — {{ queries|length }}
        </strong>
        <button type="button"
                onclick="(function(){
                    var b = document.getElementById('sql-panel-body');
                    var t = document.getElementById('sql-panel-toggle');
                    if (b.style.display === 'none') {
                        b.style.display = 'block';
                        t.textContent = 'Hide';
                    } else {
                        b.style.display = 'none';
                        t.textContent = 'Show';
                    }
                })()"
                id="sql-panel-toggle"
                style="background: #38bdf8; color: #0f172a; border: none;
                       padding: 4px 12px; border-radius: 4px; cursor: pointer;
                       font-weight: 600;">
            Hide
        </button>
    </div>

    <div id="sql-panel-body"
         style="max-height: 35vh; overflow-y: auto; padding: 8px 12px;">
        {% for q in queries %}
        <div style="margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 6px;">
            <div style="font-size: 11px; color: #94a3b8;">
                #{{ loop.index }} &middot; rowcount: {{ q.rowcount }} &middot; {{ q.ts }}
            </div>
            <pre style="margin: 2px 0 0 0; white-space: pre-wrap; word-break: break-word;
                        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                        font-size: 12px; color: #e2e8f0;">{{ q.sql | e }}</pre>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
